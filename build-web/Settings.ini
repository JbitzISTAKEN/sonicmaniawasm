; Retro Engine Config File
;
; The web loader mounts this into Emscripten's virtual filesystem before
; main() runs. It is NOT optional: UserCore.cpp does
;
;     dictionary *ini = iniparser_load("<userFileDir>Settings.ini");
;     if (ini) { ... LoadDataPack("Data.rsdk") ... }
;
; so with no Settings.ini the datapack is never opened, no game files can be
; read, the scene list comes back empty and the engine sits in
; ENGINESTATE_NONE forever.
;
; Keys match UserCore.cpp's LoadSettingsINI()/SaveSettingsINI(). This matters:
; the browser canvas fills the viewport, but the engine still uses the logical
; winWidth/winHeight to choose the internal framebuffer aspect.

[Game]
dataFile = Data.rsdk
devMenu = y
gameLogic = Game
faceButtonFlip = n
enableControllerDebugging = n
disableFocusPause = n
fastForwardSpeed = 8
region = -1
language = 0
; Name used by the game's username popup/leaderboards. Change this to your
; own non-abusive name; it is intentionally a neutral default.
username = Player

[Video]
; The browser window is always "windowed"; the Fullscreen option asks the
; page for documentElement.requestFullscreen().
windowed = y
border = y
exclusiveFS = n
vsync = n
tripleBuffering = n
pixWidth = 424
; winAuto=y makes the game window follow the browser viewport. Setting a
; Window Size / Window Aspect in either options menu switches to the fixed
; winWidth x winHeight window below and writes winAuto=n.
winAuto = y
winWidth = 424
winHeight = 240
refreshRate = 60
shaderSupport = y
screenShader = 0
maxPixWidth = 424

[Audio]
streamsEnabled = y
streamVolume = 0.8
sfxVolume = 1.0

[Keyboard Map 1]
up = 0x26
down = 0x28
left = 0x25
right = 0x27
buttonA = 0x41
buttonB = 0x53
buttonC = 0x44
buttonX = 0x51
buttonY = 0x57
buttonZ = 0x45
start = 0xD
select = 0x9
